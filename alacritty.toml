[general]
import = [
    "~/.config/alacritty/alacritty-theme/themes/catppuccin_latte.toml"
]

[window]
startup_mode = "Maximized"
decorations = "None"
opacity = 0.95
padding = { x = 12, y = 12 }

[font]
size = 13.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b\r"
