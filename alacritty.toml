[general]
import = [
    "~/.config/alacritty/alacritty-theme/themes/github_light.toml"
]

[window]
startup_mode = "Maximized"
decorations = "Full"
decorations_theme_variant = "Light"

[font]
normal = { family = "Fira Code", style = "Regular" }
bold = { family = "Fira Code", style = "Bold" }
italic = { family = "Fira Code", style = "Italic" }

size = 12.0
